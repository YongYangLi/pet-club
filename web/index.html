<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>pet-club __VERSION__</title>
  <!-- 这两个占位符由 web_gateway.py 在响应时替换。build 号必须写进 HTML：
       页面靠它判断手里这份是不是旧的，不能让 JS 去问服务端（问到的永远是最新）。 -->
  <meta name="petclub-version" content="__VERSION__">
  <meta name="petclub-build" content="__BUILD__">
  <link id="favicon" rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <!-- 认领页：没启用口令时选人物；启用了口令就是口令登录 -->
  <div id="claim-screen" class="screen">
    <div class="claim-card">
      <div class="claim-kicker">pet-club <span class="ver">v__VERSION__</span></div>
      <h1 id="claim-title">挑一个身份坐下</h1>
      <p class="claim-sub" id="claim-sub">同一时间每个身份只能有一个人</p>
      <div id="role-grid" class="role-grid"></div>
      <div id="claim-auth" class="claim-auth hidden">
        <label class="claim-auth-label" for="claim-code">认领口令</label>
        <input id="claim-code" class="claim-code" type="password"
               autocomplete="off" placeholder="管理员发给你的认领口令">
        <label class="claim-force">
          <input id="claim-force" type="checkbox">
          身份已在别处在线时强制登录（会让旧设备下线）
        </label>
      </div>
      <div id="claim-note" class="claim-note"></div>
      <div class="claim-foot">
        <div id="claim-status" class="claim-status">正在连接服务器…</div>
        <button id="claim-ok" class="btn btn-primary" type="button" disabled>进入</button>
      </div>
    </div>
  </div>

  <!-- 主界面：全屏聊天 + 悬浮人物 -->
  <div id="main-screen" class="screen hidden">
    <div class="chat-shell">
      <aside class="sidebar">
        <div class="side-head">
          <div class="brand">pet-club <span class="ver">v__VERSION__</span></div>
          <div id="online-pill" class="online-pill"><span class="dot"></span><span>0/6 在线</span></div>
        </div>
        <div class="search-wrap">
          <input id="conv-search" class="search" placeholder="搜索会话或消息" autocomplete="off">
        </div>
        <div id="conv-list" class="conv-list"></div>
        <div class="side-foot">
          <button id="me-bar" class="me-bar" type="button">
            <span id="me-avatar" class="avatar avatar-sm"></span>
            <span class="me-text"><b id="me-name"></b><small id="me-state">在线</small></span>
            <span class="me-caret">⋯</span>
          </button>
          <!-- 头像右侧：认领口令（可选）和下载桌面客户端 -->
          <div class="side-extra">
            <button id="set-code" class="side-link hidden" type="button"
                    title="修改自己的认领口令">设置口令</button>
            <a id="download-client" class="side-link" href="#" target="_blank"
               rel="noopener" title="下载和当前版本对应的桌面客户端">下载客户端</a>
          </div>
        </div>
      </aside>

      <section class="conversation">
        <header class="conv-head">
          <div>
            <div id="conv-title" class="conv-title">全体群聊</div>
            <div id="conv-sub" class="conv-sub">所有人都在这里</div>
          </div>
          <div id="conv-state" class="pill"><span class="dot"></span><span>在线</span></div>
        </header>
        <div id="messages" class="messages"></div>
        <div id="chat-note" class="chat-note"></div>
        <footer class="composer">
          <div id="quick-actions" class="quick-actions"></div>
          <div class="composer-card">
            <div id="attach-strip" class="attach-strip hidden"></div>
            <div id="quote-strip" class="quote-strip hidden"></div>
            <textarea id="composer-input" rows="3" placeholder="说点什么…"></textarea>
            <div class="composer-foot">
              <div class="composer-tools">
                <button id="emoji-btn" class="tool-btn" type="button" title="表情 / 表情包">表情</button>
                <button id="file-btn" class="tool-btn" type="button" title="图片 / 文件">文件</button>
                <button id="mention-btn" class="tool-btn tool-at" type="button" title="提到某个人">@</button>
                <button id="dice-btn" class="tool-btn" type="button" title="掷骰子">骰子</button>
              </div>
              <div class="composer-target"><span id="target-label">发送到 全体群聊</span></div>
              <div class="composer-hint">Enter 发送 · Shift+Enter 换行</div>
              <button id="send-btn" class="btn btn-primary" type="button">发送</button>
            </div>
          </div>
          <div id="media-picker" class="media-picker hidden"></div>
        </footer>
        <input id="file-input" type="file" hidden>
      </section>
    </div>

    <div id="pet-layer" class="pet-layer"></div>
    <div id="bubble-layer" class="bubble-layer"></div>
    <canvas id="fx-canvas" class="fx-canvas"></canvas>
    <div id="picker-preview" class="picker-preview hidden"></div>
    <div id="image-viewer" class="image-viewer hidden"><img id="image-viewer-img" alt=""></div>
    <div id="ctx-menu" class="ctx-menu hidden"></div>
    <div id="toast" class="toast hidden"></div>
    <div id="offline-banner" class="offline-banner hidden"><span class="dot"></span>连不上服务器，正在重试…</div>
  </div>

  <!-- 新版本提示。放在 main-screen 外面：认领页上也要能弹，
       否则用户卡在认领页就永远等不到刷新提示。 -->
  <div id="update-banner" class="update-banner hidden">
    <span id="update-text" class="update-text">有新版本</span>
    <button id="update-go" class="update-go" type="button">立即刷新</button>
  </div>

  <!-- 修改认领口令（可选，不强制设置） -->
  <div id="code-modal" class="modal hidden">
    <div class="modal-card">
      <h3>修改认领口令</h3>
      <p class="modal-sub">改完后其他设备需要重新登录；口令至少 6 位。</p>
      <input id="code-new" class="claim-code" type="password" autocomplete="off"
             placeholder="新口令">
      <input id="code-new2" class="claim-code" type="password" autocomplete="off"
             placeholder="再输一次">
      <div id="code-msg" class="modal-msg"></div>
      <div class="modal-foot">
        <button id="code-cancel" class="btn" type="button">取消</button>
        <button id="code-save" class="btn btn-primary" type="button">保存</button>
      </div>
    </div>
  </div>

  <script type="module" src="/static/js/main.js"></script>
</body>
</html>
